<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#006547" />
    <meta name="description" content="Sellam — L'outil tout-en-un pour gérer vos boutiques, ventes, stocks et bilans quotidiens. Simple, rapide et professionnel." />
    <meta name="keywords" content="gestion boutique, ventes, stocks, bilan quotidien, commerce, Sellam" />

    <!-- Google Fonts preconnect for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@600;700&amp;family=DM+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
    <title>Sellam — Gérez vos boutiques facilement</title>
  </head>
  <body>
    <script>
      if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
        if ("serviceWorker" in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            registrations.forEach(function (registration) { registration.unregister(); });
          });
        }
        if ("caches" in window) {
          caches.keys().then(function (names) {
            names.forEach(function (name) {
              if (name.indexOf("workbox-") === 0 || name.indexOf("sellam-") === 0) caches.delete(name);
            });
          });
        }
      }
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
